<!doctype html>
<script>if (/(?:^|[?&])wide=1(?:&|$)/.test(location.search)) document.documentElement.classList.add("wide");</script>
<meta charset="utf-8">
<base href="/walks/_walk-shell/">
<title>Walk</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#161922; --line:#232734; --fg:#e6e9ef; --dim:#8b93a7;
    --step:#7dd3fc; --browser:#c4b5fd; --server:#86efac; --err:#fca5a5; --warn:#fcd34d; --accent:#38bdf8;
  }
  * { box-sizing:border-box }
  html, body { height:100%; overflow:hidden; background:transparent }
  body { margin:0; background:transparent; color:var(--fg);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         display:flex; flex-direction:column }
  header { display:none }
  .meta {
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    font-size:12px; color:#5f6673; letter-spacing:.01em;
  }
  .meta strong { color:#191c22; font-size:13px; font-weight:600; letter-spacing:-.01em }
  .meta i { font-style:normal; opacity:.45 }
  main { flex:1; min-height:0; display:flex; flex-direction:column; gap:0; padding:0; overflow:hidden; background:transparent }
  .side {
    flex:0 0 auto; height:32%; min-height:140px; max-height:240px;
    display:flex; flex-direction:column; gap:0;
    min-width:0; overflow:hidden;
    background:#171717;
    border:2px solid #171717;
    border-radius:0;
    box-shadow:none;
  }
  .film { flex:1 1 0; min-height:0; position:relative }
  video {
    position:absolute; inset:0;
    width:100%; height:100%; max-height:none;
    object-fit:contain; object-position:top center;
    background:#000; border:2px solid #171717; border-radius:0; display:block;
  }
  html.wide main {
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(240px,34%);
    grid-template-rows:auto;
    grid-auto-flow:dense;
    align-items:start;
    gap:0;
  }
  html.wide .film { grid-column:1; grid-row:1; display:block; min-width:0; height:max-content; position:static; flex:none }
  html.wide .film::before { display:none }
  html.wide video {
    position:static;
    width:100%; height:auto; max-height:none;
    object-fit:contain; object-position:top center;
    border:2px solid #171717;
    border-radius:0;
  }
  html.wide .side {
    grid-column:2; grid-row:1;
    width:100%; max-width:none; min-width:0; min-height:0;
    height:auto; max-height:none;
    justify-self:stretch;
  }
  .tab-bar {
    flex:0 0 auto;
    align-self:stretch;
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:11px 16px 10px 18px;
    border-radius:0;
    background:transparent;
    border-bottom:1px solid rgba(126,224,181,.32);
  }
  .tab-bar::before {
    content:"STEPS";
    flex:0 0 2.5rem;
    width:2.5rem;
    color:#8fe8c0;
    font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.16em;
    margin-right:auto;
  }
  .tab-bar button { display:none }
  #only-bad { display:none !important }
  #log { flex:1; min-height:0; overflow-y:auto; background:transparent; border:0; border-radius:0 }
  .row { display:grid; grid-template-columns:2ch max-content 1fr; column-gap:8px; padding:2px 16px;
         border-left:2px solid transparent; cursor:pointer; font-size:12px; line-height:1.35 }
  .row:hover { background:#1c2620 }
  .row.on { background:#1a2b22; border-left-color:#8fe8c0 }
  .row.past { opacity:.55 }
  .n { color:var(--dim); text-align:right; font-variant-numeric:tabular-nums }
  .t { color:#8fe8c0; text-align:left }
  .src { display:none }
  .src { font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding-top:1px }
  .src-step .src{color:var(--step)} .src-browser .src{color:var(--browser)}
  .src-server .src{color:var(--server)} .src-runner .src{color:var(--dim)}
  .msg { white-space:pre-wrap; overflow-wrap:anywhere; padding-left:1.5rem }
  .lv-error .msg { color:var(--err) } .lv-warn .msg { color:var(--warn) }
  .row.hide { display:none }
  .empty { padding:20px; color:var(--dim); font-size:12px }
  .film.waiting::after {
    content:"Loading film…";
    position:absolute; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.4);
    color:#c8cdd6;
    font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.02em;
    pointer-events:none;
  }
</style>
<header>
  <div class="meta">
    <strong>Walk</strong>
    <i>·</i>
    <span>0.0s</span>
    <i>·</i>
    <span>YYYY-MM-DD</span>
  </div>
</header>
<main>
  <div class="side">
    <nav class="tab-bar" aria-label="Log filters">
      <button type="button" data-f="step" class="on">Steps</button>
      <button type="button" id="only-bad">Errors</button>
    </nav>
    <div id="log"></div>
  </div>
  <div class="film">
    <video id="v" src="walk.mp4" controls preload="auto"></video>
  </div>
</main>
<script>
const EVENTS = [];
const v = document.getElementById('v'), log = document.getElementById('log');
let pendingEventIndex = null;
function canSeek() {
  return v.readyState >= 1 && Number.isFinite(v.duration) && v.duration > 0;
}
function setFilmWaiting(on) {
  const film = document.querySelector('.film');
  if (film) film.classList.toggle('waiting', on);
}
function flushPendingSeek() {
  if (pendingEventIndex == null || !canSeek()) {
    setFilmWaiting(!canSeek());
    return;
  }
  const want = filmMs(EVENTS[pendingEventIndex].t) / 1000;
  try { v.currentTime = want; } catch (err) {}
  if (Math.abs(v.currentTime - want) < 0.35) pendingEventIndex = null;
  setFilmWaiting(false);
}
window.__flushWalkSeek = flushPendingSeek;
let current = -1;
v.addEventListener('loadedmetadata', flushPendingSeek);
v.addEventListener('loadeddata', flushPendingSeek);
v.addEventListener('canplay', () => setFilmWaiting(!canSeek()));
v.addEventListener('seeked', () => {
  if (pendingEventIndex == null || !canSeek()) return;
  const want = filmMs(EVENTS[pendingEventIndex].t) / 1000;
  if (Math.abs(v.currentTime - want) < 0.35) pendingEventIndex = null;
});
setFilmWaiting(!canSeek());

const fmt = ms => (ms/1000).toFixed(2) + 's';
function filmMs(t) { return t; }
function paintTimes() {
  rows.forEach((row, i) => {
    const el = row.querySelector('.t');
    if (el) el.textContent = fmt(filmMs(EVENTS[i].t));
  });
}
v.addEventListener('loadedmetadata', paintTimes);
if (window.parent !== window) {
  const start = () => { flushPendingSeek(); v.play().catch(() => {}); };
  if (v.readyState >= 2) start();
  else v.addEventListener('loadeddata', start, { once: true });
}

if (!EVENTS.length) log.innerHTML = '<div class="empty">nothing was logged during this walk</div>';
let stepNo = 0;
const rows = EVENTS.map((e, idx) => {
  const d = document.createElement('div');
  d.className = 'row src-' + e.source + ' lv-' + e.level;
  d.dataset.t = e.t; d.dataset.src = e.source; d.dataset.lv = e.level;
  const num = e.source === 'step' ? String(++stepNo) : '';
  d.innerHTML = '<span class="n">' + num + '</span><span class="t">' + fmt(filmMs(e.t)) + '</span>' +
                '<span class="msg"></span>';
  d.querySelector('.msg').textContent = e.text;
  d.onclick = () => seekToEvent(idx);
  log.appendChild(d);
  return d;
});


function highlight(i) {
  rows.forEach((r, k) => {
    r.classList.toggle('on', k === i);
    r.classList.toggle('past', k < i);
  });
  current = i;
}
function seekToEvent(i) {
  if (i < 0 || i >= EVENTS.length) return;
  pendingEventIndex = i;
  highlight(i);
  flushPendingSeek();
  v.play().catch(() => {});
}
const filters = new Set(['step','browser']);
let onlyBad = false, follow = false;
function applyFilters() {
  for (const r of rows) {
    const hide = !filters.has(r.dataset.src) || (onlyBad && r.dataset.lv === 'info');
    r.classList.toggle('hide', hide);
  }
}
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
  const f = b.dataset.f;
  filters.has(f) ? filters.delete(f) : filters.add(f);
  b.classList.toggle('on', filters.has(f));
  applyFilters();
});
document.getElementById('only-bad').onclick = e => {
  onlyBad = !onlyBad; e.target.classList.toggle('on', onlyBad); applyFilters();
};
applyFilters();

(function syncWideHeights() {
  const side = document.querySelector('.side');
  const apply = () => {
    if (!side) return;
    if (!document.documentElement.classList.contains('wide') || !v.clientHeight) {
      side.style.height = '';
      return;
    }
    side.style.height = Math.round(v.getBoundingClientRect().height) + 'px';
  };
  v.addEventListener('loadedmetadata', apply);
  window.addEventListener('resize', apply);
  if (window.ResizeObserver) new ResizeObserver(apply).observe(v);
  new MutationObserver(apply).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  apply();
})();
function tick() {
  if (pendingEventIndex != null || v.seeking || !canSeek()) {
    requestAnimationFrame(tick);
    return;
  }
  const now = v.currentTime * 1000;
  let i = -1;
  for (let k = 0; k < EVENTS.length; k++) { if (filmMs(EVENTS[k].t) <= now + 1) i = k; else break; }
  if (i !== current) {
    if (rows[current]) rows[current].classList.remove('on');
    rows.forEach((r, k) => r.classList.toggle('past', k < i));
    if (rows[i]) {
      rows[i].classList.add('on');
      if (follow && !rows[i].classList.contains('hide')) {
        rows[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }
    current = i;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
